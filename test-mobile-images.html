<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机端图片显示测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #fff;
            padding: 20px;
            line-height: 1.5;
        }
        
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 25px;
            background: linear-gradient(135deg, rgba(255, 100, 100, 0.1), rgba(255, 200, 100, 0.1));
            border-radius: 15px;
            border: 1px solid rgba(255, 100, 100, 0.3);
        }
        
        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #ff6464;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .status-panel {
            background: rgba(255, 100, 100, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 100, 100, 0.2);
        }
        
        .status-panel h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #ff6464;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .status-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .status-label {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 5px;
        }
        
        .status-value {
            font-size: 1.1rem;
            font-weight: 500;
        }
        
        .good { color: #10b981; }
        .warning { color: #f59e0b; }
        .bad { color: #ef4444; }
        
        .image-test {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .image-test h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #ff6464;
        }
        
        .test-images {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .test-image {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255, 100, 100, 0.3);
            transition: all 0.3s ease;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .test-image:hover {
            border-color: rgba(255, 100, 100, 0.6);
            transform: translateY(-5px);
        }
        
        .test-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .image-info {
            text-align: center;
            margin-top: 10px;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .fix-log {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .log-entry {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .log-time {
            color: #888;
            margin-right: 10px;
        }
        
        .log-message {
            color: #fff;
        }
        
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .info { color: #3b82f6; }
        .warning { color: #f59e0b; }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .control-btn {
            background: rgba(255, 100, 100, 0.2);
            border: 1px solid rgba(255, 100, 100, 0.4);
            color: #ff6464;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 150px;
            text-align: center;
        }
        
        .control-btn:hover {
            background: rgba(255, 100, 100, 0.3);
            transform: translateY(-2px);
        }
        
        .control-btn:active {
            transform: translateY(0);
        }
        
        .preview-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .preview-section h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #ff6464;
        }
        
        .preview-frame {
            width: 100%;
            height: 500px;
            border: 2px solid rgba(255, 100, 100, 0.3);
            border-radius: 10px;
            overflow: hidden;
            background: #fff;
        }
        
        .preview-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 1.5rem;
            }
            
            .test-images {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .preview-frame {
                height: 400px;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .control-btn {
                width: 100%;
            }
        }
        
        @media (max-width: 480px) {
            .test-images {
                grid-template-columns: 1fr;
            }
            
            .preview-frame {
                height: 300px;
            }
            
            .status-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="header">
            <h1>📱 手机端图片显示测试</h1>
            <p>检测和修复手机端图片不显示问题</p>
        </div>
        
        <div class="status-panel">
            <h2>📊 系统状态</h2>
            <div class="status-grid">
                <div class="status-item">
                    <div class="status-label">设备类型</div>
                    <div class="status-value" id="deviceStatus">检测中...</div>
                </div>
                <div class="status-item">
                    <div class="status-label">屏幕尺寸</div>
                    <div class="status-value" id="screenStatus">检测中...</div>
                </div>
                <div class="status-item">
                    <div class="status-label">图片数量</div>
                    <div class="status-value" id="imageCount">检测中...</div>
                </div>
                <div class="status-item">
                    <div class="status-label">修复状态</div>
                    <div class="status-value" id="fixStatus">等待检测...</div>
                </div>
            </div>
        </div>
        
        <div class="image-test">
            <h2>🖼️ 图片显示测试</h2>
            <div class="test-images">
                <div class="test-image">
                    <img src="https://via.placeholder.com/300x200/ff6464/ffffff?text=测试1" 
                         alt="测试图片1" 
                         loading="lazy"
                         onload="imageLoaded(this, 1)"
                         onerror="imageError(this, 1)">
                </div>
                <div class="test-image">
                    <img src="https://via.placeholder.com/300x200/3b82f6/ffffff?text=测试2" 
                         alt="测试图片2" 
                         loading="lazy"
                         onload="imageLoaded(this, 2)"
                         onerror="imageError(this, 2)">
                </div>
                <div class="test-image">
                    <img src="https://via.placeholder.com/300x200/10b981/ffffff?text=测试3" 
                         alt="测试图片3" 
                         loading="lazy"
                         onload="imageLoaded(this, 3)"
                         onerror="imageError(this, 3)">
                </div>
                <div class="test-image">
                    <img src="https://via.placeholder.com/300x200/f59e0b/ffffff?text=测试4" 
                         alt="测试图片4" 
                         loading="lazy"
                         onload="imageLoaded(this, 4)"
                         onerror="imageError(this, 4)">
                </div>
            </div>
            
            <div class="image-info">
                <p>测试图片应该立即显示。如果显示红色边框表示加载失败。</p>
            </div>
            
            <div class="fix-log" id="fixLog">
                <div class="log-entry">
                    <span class="log-time">[20:33:00]</span>
                    <span class="log-message info">图片显示测试工具已启动</span>
                </div>
            </div>
            
            <div class="controls">
                <button class="control-btn" onclick="runImageTest()">运行图片测试</button>
                <button class="control-btn" onclick="applyEmergencyFix()">应用紧急修复</button>
                <button class="control-btn" onclick="checkAllImages()">检查所有图片</button>
                <button class="control-btn" onclick="clearLog()">清空日志</button>
            </div>
        </div>
        
        <div class="preview-section">
            <h2>📱 网站预览</h2>
            <div class="preview-frame">
                <iframe src="index.html" title="网站移动端预览"></iframe>
            </div>
        </div>
    </div>
    
    <script>
        // 初始化状态检测
        function initStatus() {
            // 设备类型
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            document.getElementById('deviceStatus').textContent = isMobile ? '移动设备' : '桌面设备';
            document.getElementById('deviceStatus').className = isMobile ? 'warning' : 'good';
            
            // 屏幕尺寸
            const screenSize = `${window.innerWidth} × ${window.innerHeight}`;
            document.getElementById('screenStatus').textContent = screenSize;
            
            // 图片数量
            const imageCount = document.querySelectorAll('img').length;
            document.getElementById('imageCount').textContent = `${imageCount} 张`;
            document.getElementById('imageCount').className = imageCount > 0 ? 'good' : 'bad';
            
            // 修复状态
            document.getElementById('fixStatus').textContent = '就绪';
            document.getElementById('fixStatus').className = 'good';
            
            addLog('系统状态检测完成', 'info');
        }
        
        // 添加日志
        function addLog(message, type = 'info') {
            const log = document.getElementById('fixLog');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            
            const now = new Date();
            const timeStr = `[${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}]`;
            
            entry.innerHTML = `
                <span class="log-time">${timeStr}</span>
                <span class="log-message ${type}">${message}</span>
            `;
            
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }
        
        // 图片加载成功
        function imageLoaded(img, num) {
            img.parentElement.style.borderColor = 'rgba(16, 185, 129, 0.6)';
            addLog(`✅ 测试图片 ${num} 加载成功`, 'success');
            updateStatus();
        }
        
        // 图片加载失败
        function imageError(img, num) {
            img.parentElement.style.borderColor = 'rgba(239, 68, 68, 0.6)';
            img.parentElement.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
            addLog(`❌ 测试图片 ${num} 加载失败`, 'error');
            updateStatus();
        }
        
        // 运行图片测试
        function runImageTest() {
            addLog('开始图片显示测试...', 'info');
            
            const testImages = document.querySelectorAll('.test-image img');
            let loaded = 0;
            let failed = 0;
            
            testImages.forEach((img, index) => {
                if (img.complete && img.naturalHeight > 0) {
                    loaded++;
                    img.parentElement.style.borderColor = 'rgba(16, 185, 129, 0.6)';
                } else if (img.complete && img.naturalHeight === 0) {
                    failed++;
                    img.parentElement.style.borderColor = 'rgba(239, 68, 68, 0.6)';
                }
            });
            
            addLog(`测试结果: ${loaded}✅ ${failed}❌`, loaded === testImages.length ? 'success' : 'warning');
            
            if (failed > 0) {
                addLog('⚠️ 检测到图片加载失败，建议应用紧急修复', 'warning');
            }
        }
        
        // 应用紧急修复
        function applyEmergencyFix() {
            addLog('应用紧急图片修复...', 'info');
            
            // 修复所有图片
            const allImages = document.querySelectorAll('img');
            allImages.forEach(img => {
                // 确保图片显示
                img.style.display = 'block';
                img.style.visibility = 'visible';
                img.style.opacity = '1';
                
                // 修复懒加载
                if (img.dataset.src && !img.src) {
                    img.src = img.dataset.src;
                }
                
                // 重新加载失败的图片
                if (img.complete && img.naturalHeight === 0 && img.src) {
                    const originalSrc = img.src;
                    img.src = '';
                    setTimeout(() => {
                        img.src = originalSrc;
                        addLog(`🔄 重新加载图片: ${img.alt || '未命名'}`, 'info');
                    }, 100);
                }
            });
            
            addLog(`✅ 已修复 ${allImages.length} 张图片`, 'success');
            updateStatus();
            
            // 重新运行测试
            setTimeout(runImageTest, 500);
        }
        
        // 检查所有图片
        function checkAllImages() {
            addLog('检查所有页面图片...', 'info');
            
            const allImages = document.querySelectorAll('img');
            let loaded = 0;
            let failed = 0;
            let loading = 0;
            
            allImages.forEach(img => {
                if (img.complete) {
                    if (img.naturalHeight > 0) {
                        loaded++;
                    } else {
                        failed++;
                    }
                } else {
                    loading++;
                }
            });
            
            addLog(`页面图片统计: ${loaded}✅ ${failed}❌ ${loading}⏳`, failed === 0 ? 'success' : 'warning');
            
            if (failed > 0) {
                addLog(`发现 ${failed} 张图片加载失败，建议应用紧急修复`, 'error');
            }
        }
        
        // 更新状态
        function updateStatus() {
            const allImages = document.querySelectorAll('img');
            const loadedImages = Array.from(allImages).filter(img => img.complete && img.naturalHeight > 0);
            const successRate = allImages.length > 0 ? Math.round((loadedImages.length / allImages.length) * 100) : 0;
            
            document.getElementById('fixStatus').textContent = `${successRate}% 成功`;
            document.getElementById('fixStatus').className = successRate >=
